# 生产/Compose 环境：mysql 为 docker-compose.yaml 中的服务名。
server:
  address: ":8000"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

database:
  default:
    link: "mysql:hercules:hercules@tcp(mysql:3306)/hercules_admin?loc=Asia%2FShanghai&parseTime=true"
    debug: false

security:
  jwtSecret: "change-this-secret-before-production"
  jwtExpireHours: 12

logger:
  level: "info"
  stdout: true

