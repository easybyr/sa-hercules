# 测试环境：CI 流水线可设置 DATABASE_DSN 指向独立的测试数据库。
server:
  host: "0.0.0.0"
  port: 8000
  corsOrigins:
    - "*"

database:
  dsn: "postgresql+asyncpg://hercules:hercules@127.0.0.1:5432/hercules_admin_test"
  echo: false
  poolSize: 2
  maxOverflow: 5
  poolRecycleSeconds: 1800

security:
  jwtSecret: "hercules-test-secret-change-me"
  jwtExpireHours: 12

logger:
  level: "INFO"
