services:
  postgres:
    image: postgres:16-alpine
    container_name: hercules-pyadmin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hercules_admin}
      POSTGRES_USER: ${POSTGRES_USER:-hercules}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hercules}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_timezone=Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./resources/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - hercules

  pyadmin:
    build:
      context: .
      dockerfile: Dockerfile
    image: hercules-pyadmin:latest
    container_name: hercules-pyadmin-api
    restart: unless-stopped
    environment:
      APP_ENV: prod
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-production}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-12}
      DATABASE_DSN: "postgresql+asyncpg://${POSTGRES_USER:-hercules}:${POSTGRES_PASSWORD:-hercules}@postgres:5432/${POSTGRES_DB:-hercules_admin}"
      TZ: Asia/Shanghai
    ports:
      - "${PYADMIN_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hercules

  admin-web:
    build:
      context: ../admin-web
      dockerfile: Dockerfile
    container_name: hercules-pyadmin-web
    restart: unless-stopped
    ports:
      - "${ADMIN_WEB_PORT:-5173}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      pyadmin:
        condition: service_healthy
    networks:
      - hercules

volumes:
  postgres_data:

networks:
  hercules:
    driver: bridge
